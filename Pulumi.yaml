name: cloud-platform-pipeline
description: Production-grade Cloud Platform built with Pulumi, AWS and GitHub Actions

runtime:
    name: nodejs
    options:
        packagemanager: npm

main: infra

config:
    pulumi:tags:
        value:
            Project: cloud-platform-pipeline
            Owner: Folarin Favour
            Environment: dev
            ManagedBy: Pulumi
            Repository: github.com/mr-ffo/cloud-platform-pipeline
